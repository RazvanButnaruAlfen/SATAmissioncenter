<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      --pink: #ff70b8;
      --blue: #72c7ff;
      --gold: #ffd98d;
      --muted: #b8a7b5;
      --panel: #18101b;
      --border: rgba(255,112,184,.38);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 178px;
      min-height: 0;
      overflow: hidden;
      background: transparent;
      color: white;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      height: 174px;
      min-height: 0;
      overflow: hidden;
      padding: 2px 1px 4px;
    }

    .label {
      margin-bottom: 10px;
      font-size: .92rem;
      font-weight: 700;
      color: #e7dde5;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--pink);
      cursor: pointer;
      touch-action: none;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 9px;
      align-items: center;
    }

    .value {
      min-width: 54px;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--pink);
    }

    .status {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(35,18,34,.78);
      color: var(--muted);
      text-align: center;
      font-size: .84rem;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .hint {
      margin-top: 7px;
      color: #998b97;
      font-size: .76rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label">Frecvență de recepție</div>
    <input id="slider" type="range" min="0" max="100" value="50" aria-label="Frecvență de recepție">
    <div class="row">
      <div id="value" class="value">50</div>
      <div id="status" class="status">Ține sliderul apăsat pentru scanare audio.</div>
    </div>
    <div class="hint">Tonul urcă pe măsură ce te apropii de frecvența ascunsă.</div>
  </div>

  <script>
    (() => {
      const slider = document.getElementById("slider");
      const valueLabel = document.getElementById("value");
      const status = document.getElementById("status");

      let target = 50;
      let tolerance = 5;
      let audio = null;
      let lastSentValue = Number(slider.value);

      function send(type, payload = {}) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type, ...payload },
          "*"
        );
      }

      function setHeight() {
        // Fixed compact height prevents the iframe from inheriting an
        // unexpectedly large scrollHeight in Streamlit Cloud.
        send("streamlit:setFrameHeight", { height: 182 });
      }

      function sendValue(value) {
        lastSentValue = Number(value);
        send("streamlit:setComponentValue", { value: lastSentValue });
      }

      function frequencyFor(value) {
        const distance = Math.abs(Number(value) - target);
        const closeness = Math.max(0, 1 - Math.min(distance, 50) / 50);
        return 170 + Math.pow(closeness, 1.5) * 1030;
      }

      function updateVisuals() {
        const value = Number(slider.value);
        const delta = value - target;
        const distance = Math.abs(delta);

        valueLabel.textContent = String(value);

        if (distance <= tolerance) {
          status.textContent = "✓ ZONĂ DE BLOCARE — ELIBEREAZĂ ȘI VERIFICĂ";
          status.style.color = "var(--gold)";
          status.style.borderColor = "rgba(255,217,141,.75)";
        } else if (delta < 0) {
          status.textContent = "↑ MAI SUS";
          status.style.color = "var(--blue)";
          status.style.borderColor = "rgba(114,199,255,.45)";
        } else {
          status.textContent = "↓ MAI JOS";
          status.style.color = "var(--pink)";
          status.style.borderColor = "rgba(255,112,184,.45)";
        }

        if (audio) {
          const now = audio.context.currentTime;
          audio.oscillator.frequency.setTargetAtTime(
            frequencyFor(value),
            now,
            0.018
          );

          const gainValue = distance <= tolerance ? 0.11 : 0.055;
          audio.gain.gain.setTargetAtTime(gainValue, now, 0.025);
        }
      }

      async function startAudio() {
        if (audio) return;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) {
          status.textContent = "Audio indisponibil în acest browser.";
          return;
        }

        const context = new AudioContext();
        await context.resume();

        const oscillator = context.createOscillator();
        const gain = context.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = frequencyFor(slider.value);
        gain.gain.value = 0.0001;

        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start();

        audio = { context, oscillator, gain };
        updateVisuals();
      }

      function stopAudio() {
        if (!audio) {
          sendValue(slider.value);
          return;
        }

        const current = audio;
        audio = null;

        try {
          current.gain.gain.setTargetAtTime(
            0.0001,
            current.context.currentTime,
            0.018
          );
        } catch (_) {}

        setTimeout(() => {
          try { current.oscillator.stop(); } catch (_) {}
          try { current.context.close(); } catch (_) {}
        }, 85);

        sendValue(slider.value);
      }

      slider.addEventListener("pointerdown", startAudio);
      slider.addEventListener("pointerup", stopAudio);
      slider.addEventListener("pointercancel", stopAudio);
      slider.addEventListener("input", updateVisuals);
      slider.addEventListener("change", () => sendValue(slider.value));

      // Touch fallback for browsers with incomplete Pointer Events.
      slider.addEventListener("touchstart", startAudio, { passive: true });
      slider.addEventListener("touchend", stopAudio, { passive: true });
      slider.addEventListener("touchcancel", stopAudio, { passive: true });

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.type !== "streamlit:render") return;

        const args = data.args || {};
        target = Number(args.target ?? 50);
        tolerance = Number(args.tolerance ?? 5);

        const incomingValue = Number(args.value ?? lastSentValue ?? 50);
        if (!audio && Number.isFinite(incomingValue)) {
          slider.value = String(incomingValue);
          lastSentValue = incomingValue;
        }

        updateVisuals();
        setHeight();
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      setHeight();
    })();
  </script>
</body>
</html>
